<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>thinkbasic</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --primary: #38bdf8;
      --secondary: #818cf8;
      --accent: #f43f5e;
      --bg: #070913;
      --card-bg: rgba(15, 20, 36, 0.85);
      --border: rgba(255, 255, 255, 0.08);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background-color: var(--bg);
      background-image: 
        radial-gradient(circle at 20% 15%, rgba(56, 189, 248, 0.12) 0%, transparent 40%),
        radial-gradient(circle at 80% 80%, rgba(244, 63, 94, 0.1) 0%, transparent 40%);
      color: #f1f5f9;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Navbar */
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 40px;
      background: rgba(7, 9, 19, 0.9);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
    }

    .brand-icon {
      width: 40px;
      height: 40px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 1.1rem;
      color: #070913;
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.4);
    }

    .nav-links {
      display: flex;
      gap: 14px;
      list-style: none;
    }

    .nav-btn {
      background: none;
      border: none;
      color: #94a3b8;
      font-size: 0.95rem;
      font-weight: 600;
      padding: 8px 16px;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.25s;
    }

    .nav-btn:hover {
      color: var(--primary);
      background: rgba(56, 189, 248, 0.08);
    }

    .nav-btn.active {
      color: #fff;
      background: rgba(56, 189, 248, 0.15);
      border: 1px solid rgba(56, 189, 248, 0.3);
    }

    /* Container & Slide */
    .page-slide {
      max-width: 1050px;
      margin: 40px auto 80px;
      padding: 0 24px;
    }

    /* Hero */
    .hero {
      text-align: center;
      padding: 40px 20px 20px;
      max-width: 900px;
      margin: 0 auto;
    }

    .pill-tag {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 18px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border);
      border-radius: 99px;
      font-size: 0.85rem;
      color: #cbd5e1;
      margin-bottom: 24px;
    }

    .hero-title {
      font-size: 3.4rem;
      font-weight: 900;
      line-height: 1.15;
      letter-spacing: -1px;
      margin-bottom: 16px;
    }

    .gradient-word {
      background: linear-gradient(135deg, #38bdf8 0%, #818cf8 50%, #f43f5e 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .hero-desc {
      font-size: 1.1rem;
      color: #94a3b8;
      max-width: 620px;
      margin: 0 auto 36px;
      line-height: 1.6;
    }

    .btn {
      padding: 12px 22px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 0.95rem;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      border: none;
      transition: all 0.25s;
      text-decoration: none;
    }

    .btn-glow {
      background: linear-gradient(135deg, #38bdf8, #6366f1);
      color: #07091
