<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ThinkBasic - Profile</title>
  <!-- Icon FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: radial-gradient(circle at top, #1e1b4b, #0f172a, #020617);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
      color: #f8fafc;
    }

    /* Thẻ chính phong cách kính mờ */
    .container {
      width: 100%;
      max-width: 420px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 28px;
      padding: 40px 28px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
      text-align: center;
    }

    /* Ảnh đại diện */
    .avatar-wrapper {
      position: relative;
      width: 110px;
      height: 110px;
      margin: 0 auto 20px;
    }

    .avatar {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid rgba(255, 255, 255, 0.3);
      box-shadow: 0 0 25px rgba(99, 102, 241, 0.5);
    }

    .status-dot {
      position: absolute;
      bottom: 4px;
      right: 4px;
      width: 18px;
      height: 18px;
      background: #22c55e;
      border: 3px solid #0f172a;
      border-radius: 50%;
    }

    /* Thông tin cá nhân */
    h1 {
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
      background: linear-gradient(to right, #ffffff, #a5b4fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .bio {
      font-size: 0.95rem;
      color: #94a3b8;
      margin-bottom: 28px;
      line-height: 1.5;
    }

    /* Danh sách các nút liên kết */
    .links-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .link-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      color: #f1f5f9;
      text-decoration: none;
      font-weight: 500;
      font-size: 0.95rem;
      transition: all 0.25s ease;
    }

    .link-item .left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .link-item i {
      font-size: 1.25rem;
      width: 24px;
      text-align: center;
    }

    .link-item:hover {
      background: rgba(99, 102, 241, 0.2);
      border-color: rgba(129, 140, 248, 0.4);
      transform: translateY(-2px);
      box-shadow: 0 10px 20px -5px rgba(99, 102, 241, 0.3);
    }

    /* Footer nhỏ */
    .footer {
      margin-top: 32px;
      font-size: 0.8rem;
      color: #64748b;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Ảnh đại diện -->
    <div class="avatar-wrapper">
      <img class="avatar" src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=300&q=80" alt="Avatar">
      <div class="status-dot"></div>
    </div>

    <!-- Tên & Mô tả -->
    <h1>ThinkBasic</h1>
    <p class="bio">Chào mừng bạn ghé thăm trang cá nhân của mình! Kết nối với mình qua các liên kết bên dưới nhé.</p>

    <!-- Các nút liên kết -->
    <div class="links-list">
      <a href="https://facebook.com" target="_blank" class="link-item">
        <div class="left">
          <i class="fa-brands fa-facebook" style="color: #1877f2;"></i>
          <span>Facebook</span>
        </div>
        <i class="fa-solid fa-chevron-right" style="font-size: 0.8rem; color: #64748b;"></i>
      </a>

      <a href="https://zalo.me" target="_blank" class="link-item">
        <div class="left">
          <i class="fa-solid fa-comment-dots" style="color: #0ea5e9;"></i>
          <span>Zalo Chat</span>
        </div>
        <i class="fa-solid fa-chevron-right" style="font-size: 0.8rem; color: #64748b;"></i>
      </a>

      <a href="https://github.com" target="_blank" class="link-item">
        <div class="left">
          <i class="fa-brands fa-github" style="color: #f8fafc;"></i>
          <span>GitHub</span>
        </div>
        <i class="fa-solid fa-chevron-right" style="font-size: 0.8rem; color: #64748b;"></i>
      </a>

      <a href="mailto:example@gmail.com" class="link-item">
        <div class="left">
          <i class="fa-solid fa-envelope" style="color: #f43f5e;"></i>
          <span>Gửi Email</span>
        </div>
        <i class="fa-solid fa-chevron-right" style="font-size: 0.8rem; color: #64748b;"></i>
      </a>
    </div>

    <div class="footer">
      © 2026 ThinkBasic. Hosted on Render.
    </div>
  </div>

</body>
</html>
