<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trang Web Của Tôi</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      padding: 40px;
      border-radius: 16px;
      text-align: center;
      max-width: 480px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    }
    h1 { font-size: 2rem; margin-bottom: 16px; color: #38bdf8; }
    p { font-size: 1rem; line-height: 1.6; color: #cbd5e1; margin-bottom: 24px; }
    .badge {
      display: inline-block;
      padding: 8px 16px;
      background: #0284c7;
      color: white;
      border-radius: 9999px;
      font-weight: 600;
      font-size: 0.875rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Xin chào!</h1>
    <p>Trang web này đã được tạo và triển khai thành công trên Render.</p>
    <div class="badge">Đang hoạt động trên Render</div>
  </div>
</body>
</html>
