<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ThinkBasic - Luyện Đề TSA & HSA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #38bdf8;
      --secondary: #818cf8;
      --accent: #f43f5e;
      --success: #22c55e;
      --bg: #070913;
      --card-bg: rgba(15, 20, 36, 0.88);
      --border: rgba(255, 255, 255, 0.12);
      --text: #f1f5f9;
      --text-muted: #94a3b8;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    /* Canvas chứa hạt vũ trụ & hiệu ứng click */
    #space-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
      pointer-events: none;
      background: transparent;
    }

    .glow-light {
      position: fixed;
      width: 600px;
      height: 600px;
      border-radius: 50%;
      filter: blur(140px);
      z-index: 0;
      pointer-events: none;
      opacity: 0.18;
      animation: ambientShift 12s infinite alternate ease-in-out;
    }
    .glow-1 { top: -150px; left: 10%; background: #00f2fe; }
    .glow-2 { bottom: -150px; right: 10%; background: #f43f5e; animation-delay: -6s; }

    @keyframes ambientShift {
      0% { transform: scale(1) translate(0, 0); }
      100% { transform: scale(1.2) translate(40px, 30px); }
    }

    .app-container {
      position: relative;
      z-index: 10;
    }

    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 44px;
      background: rgba(7, 9, 19, 0.9);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      user-select: none;
      transition: transform 0.15s ease;
    }

    .brand:active {
      transform: scale(0.96);
    }

    .brand-logo {
      width: 42px;
      height: 42px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 1.15rem;
      color: #070913;
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.45);
    }

    .brand-title {
      font-weight: 800;
      font-size: 1.15rem;
      letter-spacing: 0.5px;
    }

    .brand-sub {
      font-size: 0.65rem;
      color: var(--text-muted);
      font-weight: 700;
      letter-spacing: 1.2px;
    }

    .nav-buttons {
      display: flex;
      gap: 10px;
    }

    .nav-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 0.92rem;
      font-weight: 600;
      padding: 8px 16px;
      border-radius: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
      user-select: none;
    }

    .nav-btn:hover {
      color: var(--primary);
      background: rgba(56, 189, 248, 0.1);
    }

    .nav-btn:active {
      transform: scale(0.94);
    }

    .nav-btn.active {
      color: #fff;
      background: rgba(56, 189, 248, 0.18);
      border: 1px solid rgba(56, 189, 248, 0.4);
      box-shadow: 0 0 16px rgba(56, 189, 248, 0.25);
    }

    .tab-view {
      max-width: 1100px;
      margin: 40px auto 80px;
      padding: 0 20px;
    }

    .hero {
      text-align: center;
      padding: 40px 20px 20px;
      max-width: 900px;
      margin: 0 auto;
    }

    .tag-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 20px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      border-radius: 99px;
      font-size: 0.85rem;
      color: #cbd5e1;
      margin-bottom: 24px;
    }

    .hero-h1 {
      font-size: 3.5rem;
      font-weight: 900;
      line-height: 1.25;
      letter-spacing: -1px;
      margin-bottom: 16px;
      min-height: 140px;
    }

    .gradient-txt {
      background: linear-gradient(135deg, #38bdf8 0%, #818cf8 50%, #f43f5e 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 35px rgba(56, 189, 248, 0.4));
    }

    .type-cursor {
      display: inline-block;
      margin-left: 2px;
      color: var(--primary);
      animation: blinkCursor 0.8s infinite;
    }

    @keyframes blinkCursor {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    .hero-desc {
      font-size: 1.15rem;
      color: var(--text-muted);
      max-width: 640px;
      margin: 0 auto 36px;
      line-height: 1.6;
    }

    .cta-row {
      display: flex;
      justify-content: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .btn {
      padding: 12px 24px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 0.95rem;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      border: none;
      transition: all 0.2s ease;
      text-decoration: none;
      user-select: none;
    }

    .btn:active {
      transform: scale(0.95);
    }

    .btn-glow {
      background: linear-gradient(135deg, #38bdf8, #6366f1);
      color: #070913;
      box-shadow: 0 10px 25px -4px rgba(56, 189, 248, 0.45);
    }

    .btn-glow:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 32px rgba(99, 102, 241, 0.55);
      color: #fff;
    }

    .
