<html lang="vi">
<head>
  <meta charset="UTF-8">

  <style>
    :root {
      --primary: #ff3344;
      --primary-glow: rgba(255, 51, 68, 0.45);
      --bg-dark: #0b0f19;
      --card-bg: rgba(18, 24, 38, 0.7);
      --border-color: rgba(255, 255, 255, 0.08);
      --text-muted: #8492a6;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: #f1f5f9;
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    /* Lớp Canvas hiệu ứng mạng nhện/hạt chuyển động */
    #particles-js {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    .wrapper {
      position: relative;
      z-index: 1;
    }

    /* 1. Header / Navbar */
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 48px;
      background: rgba(11, 15, 25, 0.85);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border-color);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .nav-brand {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: #fff;
    }

    .brand-logo {
      width: 42px;
      height: 42px;
      background: linear-gradient(135deg, #ef4444, #991b1b);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 0.9rem;
      box-shadow: 0 0 15px var(--primary-glow);
    }

    .brand-info h2 {
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .brand-info span {
      font-size: 0.65rem;
      color: var(--primary);
      text-transform: uppercase;
      font-weight: 800;
      letter-spacing: 1px;
    }

    .nav-links {
      display: flex;
      gap: 28px;
      list-style: none;
    }

    .nav-links a {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.92rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 7px;
      transition: all 0.2s;
    }

    .nav-links a:hover, .nav-links a.active {
      color: #ffffff;
    }

    .nav-user {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-color);
      padding: 6px 14px;
      border-radius: 9999px;
      font-size: 0.88rem;
      font-weight: 600;
    }

    .user-avatar-tag {
      width: 26px;
      height: 26px;
      background: #f97316;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
      color: white;
      font-weight: 800;
    }

    /* 2. Hero Section */
    .hero {
      text-align: center;
      padding: 60px 20px 30px;
      max-width: 800px;
      margin: 0 auto;
    }

      height: 105px;
