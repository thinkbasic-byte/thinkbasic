<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ThinkBasic - Luyện Đề TSA & HSA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --primary: #38bdf8;
      --secondary: #818cf8;
      --accent: #f43f5e;
      --bg: #070913;
      --card-bg: rgba(15, 20, 36, 0.78);
      --border: rgba(255, 255, 255, 0.1);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background-color: var(--bg);
      color: #f1f5f9;
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    /* Canvas nền chứa hạt né chuột */
    #particle-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    /* Hiệu ứng hào quang nền lập lòe */
    .glow-light {
      position: fixed;
      width: 550px;
      height: 550px;
      border-radius: 50%;
      filter: blur(140px);
      z-index: 0;
      pointer-events: none;
      opacity: 0.22;
      animation: floatLight 10s infinite alternate ease-in-out;
    }
    .light-1 { top: -120px; left: 15%; background: #00f2fe; }
    .light-2 { bottom: -100px; right: 10%; background: #f43f5e; animation-delay: -5s; }

    @keyframes floatLight {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(50px, 40px) scale(1.18); }
    }

    .wrapper {
      position: relative;
      z-index: 10;
    }

    /* Navbar */
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 48px;
      background: rgba(7, 9, 19, 0.85);
      backdrop-filter: blur(18px);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
    }

    .brand-icon {
      width: 42px;
      height: 42px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 1.15rem;
      color: #070913;
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.5);
    }

    .nav-links {
      display: flex;
      gap: 14px;
      list-style: none;
    }

    .nav-btn {
      background: none;
      border: none;
      color: #94a3b8;
      font-size: 0.95rem;
      font-weight: 600;
      padding: 8px 18px;
      border-radius: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.25s;
    }

    .nav-btn:hover {
      color: var(--primary);
      background: rgba(56, 189, 248, 0.1);
    }

    .nav-btn.active {
      color: #fff;
      background: rgba(56, 189, 248, 0.16);
      border: 1px solid rgba(56, 189, 248, 0.35);
      box-shadow: 0 0 16px rgba(56, 189, 248, 0.2);
    }

    /* Các Slide */
    .page-slide {
      max-width: 1050px;
      margin: 40px auto 80px;
      padding: 0 24px;
      animation: fadeIn 0.4s ease forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Hero */
    .hero {
      text-align: center;
      padding: 40px 20px 20px;
      max-width: 900px;
      margin: 0 auto;
    }

    .pill-tag {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 20px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      border-radius: 99px;
      font-size: 0.85rem;
      color: #cbd5e1;
      margin-bottom: 24px;
      backdrop-filter: blur(10px);
    }

    .hero-title {
      font-size: 3.6rem;
      font-weight: 900;
      line-height: 1.15;
      letter-spacing: -1px;
      margin-bottom: 16px;
    }

    .gradient-word {
      background: linear-gradient(135deg, #38bdf8 0%, #818cf8 50%, #f43f5e 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 35px rgba(56, 189, 248, 0.4));
    }

    .hero-desc {
      font-size: 1.15rem;
      color: #94a3b8;
      max-width: 620px;
      margin: 0 auto 36px;
      line-height: 1.6;
    }
